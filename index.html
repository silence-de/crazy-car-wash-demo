  <div id="app">
    <aside id="side-note">
      <span class="tag">可玩 Demo · 竖屏</span>
      <h1>泡泡车行</h1>
      <p>按住车身拖动来洗车：冲泥巴、撕小广告、泡沫软化鸟屎、打蜡抛光。洗完每个部位都会“叮”一声，整辆车洗完有闪光结算。</p>
      <ul>
        <li>每天几位动物顾客，排队有耐心，越快越多小费</li>
        <li>赚钱升级工具和店铺，升级解锁新车、新污渍、新玩法</li>
        <li>泥巴下面藏着硬币、失物和收藏品</li>
        <li>图鉴、每日任务、离线学徒收益</li>
      </ul>
      <p>建议用手机打开，或把浏览器调成手机尺寸。键盘 1–4 切换工具，Esc 暂停。</p>
    </aside>
    <div id="stage">
      <canvas id="game"></canvas>
    </div>
  </div>
